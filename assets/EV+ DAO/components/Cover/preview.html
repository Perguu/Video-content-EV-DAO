<style>
  html, body { margin:0; height:100%; }
  body { background:var(--paper); color:var(--ink); font-family:var(--font-sans, "Geist", system-ui, sans-serif); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .sig { fill:var(--signal); }
  .slab { fill:var(--ink); }
  .tint { fill:var(--signal-tint); }
  .amber { fill:var(--caution-tint); }
  .phos { fill:var(--phosphor); }
  .cut { fill:var(--paper); }
  .sq { rx:var(--radius-none); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-family:var(--font-pixel, "Geist Pixel", monospace); font-weight:400; font-size:96px; line-height:.92; color:var(--ink); letter-spacing:0; }
  .tag { margin:var(--space-3) 0 0 2px; font-family:var(--font-mono, "Geist Mono", monospace); font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
